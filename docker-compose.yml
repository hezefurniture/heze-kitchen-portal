services:
  app:
    build: .
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://heze:${DB_PASSWORD:-changeme}@db:5432/kitchen_portal
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secret-change-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heze
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: kitchen_portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heze -d kitchen_portal"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
